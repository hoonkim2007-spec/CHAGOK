:root{
  color-scheme:light;
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#1A1A1A;--muted:#5C5C5C;--line:#E2E2E2;--line-soft:#EDEDED;--accent:#C8102E;--accent-ink:#FFFFFF;--accent-bg:#FBEAEC;--gold:#C8102E;--band:#FFFFFF;--band-ink:#1A1A1A;--band-gold:#C8102E;--ok:#2E7D68;--ok-bg:#E3F1EC;--bad:#B45309;--bad-bg:#FDF0E1;
  --serif:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --logo:"CHAGOK Logo","Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}

/* 로고 띠 */
.hero{position:relative;overflow:hidden;background:var(--band);color:var(--band-ink);border-radius:18px;
  padding:26px 22px 24px;margin:0 0 16px;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end;
  transition:min-height .7s cubic-bezier(.2,.7,.2,1), border-radius .7s}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;border:1px solid var(--band-gold);opacity:.5;
  box-shadow:0 0 0 20px var(--band),0 0 0 21px var(--band-gold);pointer-events:none}
.hero::before{content:"";position:absolute;left:-90px;bottom:-130px;width:220px;height:220px;border-radius:50%;border:1px solid var(--band-gold);opacity:.18;
  box-shadow:0 0 0 18px var(--band),0 0 0 19px color-mix(in srgb,var(--band-gold) 60%,transparent);pointer-events:none}
.eyebrow{display:block;font-size:.78rem;font-weight:600;letter-spacing:.12em;color:var(--band-gold);margin:0 0 10px;position:relative;z-index:1}
.logo-row{display:flex;align-items:flex-end;flex-wrap:nowrap;gap:12px;position:relative;z-index:1}
.logo{font-family:var(--logo);font-weight:560;font-stretch:118%;font-size:clamp(1.9rem,8.4vw,3rem);line-height:1;letter-spacing:.06em;margin:0;color:var(--band-ink)}
.powered{font-family:var(--logo);font-stretch:110%;font-size:clamp(.58rem,2.3vw,.72rem);letter-spacing:.14em;color:var(--band-gold);padding-bottom:.35em;white-space:nowrap}
.powered b{font-weight:600;letter-spacing:.18em}
.rule{display:block;width:44px;height:3px;background:var(--band-gold);border-radius:2px;margin:14px 0 0;position:relative;z-index:1}
.hero p{margin:12px 0 0;font-size:.95rem;opacity:.9;position:relative;z-index:1}

/* 첫 화면: 로고만 크게 */
body.splash .hero{min-height:calc(100svh - 40px);border-radius:24px;justify-content:center;align-items:center;text-align:center}
body.splash .logo-row{justify-content:center}
body.splash .rule{margin-left:auto;margin-right:auto}
body.splash .menu,body.splash .foot,body.splash .hero p,body.splash .eyebrow{opacity:0;pointer-events:none}
body.splash .logo{font-size:clamp(2rem,9vw,4.4rem)}
.menu,.foot,.hero p,.eyebrow{transition:opacity .5s .25s}
.logo{transition:font-size .7s cubic-bezier(.2,.7,.2,1)}
@media (prefers-reduced-motion:no-preference){
  body.splash .logo{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  body.splash .powered{animation:fade .6s .55s both}
  body.splash .rule{animation:grow .6s .45s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:.2em}to{opacity:1;transform:none;letter-spacing:.06em}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes grow{from{width:0}to{width:44px}}
}
@media (prefers-reduced-motion:reduce){.hero,.logo,.menu,.foot,.hero p,.eyebrow{transition:none}}
.skip{position:absolute;inset:0;background:none;border:0;cursor:pointer;z-index:2}
body:not(.splash) .skip{display:none}

/* 고르기 */
.pick{font:inherit;position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);
  padding:20px 48px 20px 20px;margin:0 0 12px;cursor:pointer;min-height:88px;box-shadow:0 1px 0 var(--line);text-decoration:none}
.pick::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:1.6rem;color:var(--accent);line-height:1}
.pick b{display:block;font-family:var(--logo);font-weight:560;font-stretch:115%;font-size:1.45rem;letter-spacing:.1em;line-height:1.2}
.pick small{display:block;margin-top:6px;font-size:.88rem;color:var(--muted)}
.pick .dd{display:inline-block;margin-top:8px;font-family:var(--serif);font-weight:700;font-size:.95rem;color:var(--gold)}
.pick:hover{border-color:var(--accent)}
.pick.ko b{font-family:var(--serif);font-weight:700;font-stretch:100%;font-size:1.5rem;letter-spacing:.04em}
@media (prefers-reduced-motion:no-preference){.pick{transition:transform .08s ease,border-color .15s}.pick:active{transform:scale(.985)}}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;padding:10px 0;min-height:44px}
.sub{font-family:var(--serif);font-size:1.25rem;font-weight:700;margin:4px 0 12px}
.hidden{display:none!important}
.foot{font-size:.8rem;color:var(--muted);text-align:center;margin:18px 0 0}

/* ---- 동탄국제고 테마 (흰 바탕 · 동탄 레드 포인트 · Noto Sans KR) */
.hero{background:var(--band)!important;color:var(--band-ink);border:1px solid var(--line);box-shadow:none}

.eyebrow,.hero .eyebrow{display:flex!important;align-items:center;gap:8px;color:var(--muted)!important;letter-spacing:.08em}

<script>
"use strict";
const body=document.body;
function open(){ body.classList.remove("splash"); }
let seen=false; try{ seen=sessionStorage.getItem("chagok-splash")==="1"; sessionStorage.setItem("chagok-splash","1"); }catch(e){}
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if(seen) open(); else setTimeout(open, reduce?600:1700);
document.getElementById("skip").onclick=open;
// 과목 고르기는 같은 화면에서 바꾼다 (#study로 바로 열 수도 있음)
const main=document.getElementById("menuMain"), study=document.getElementById("menuStudy");
function showStudy(on){ main.classList.toggle("hidden",on); study.classList.toggle("hidden",!on); }
document.getElementById("goStudy").onclick=()=>{ showStudy(true); history.replaceState(null,"","#study"); };
document.getElementById("backMain").onclick=()=>{ showStudy(false); history.replaceState(null,"",location.pathname+location.search); };
if(location.hash==="#study"){ open(); showStudy(true); }
// PLAN 카드에 다음 정기고사 D-day (1학년 기준, 2026학년도 학사일정)
const EXAMS=[["2026-12-08","2차 정기시험"]];
(function(){ const u=new Date(Date.now()+9*3600e3); const today=new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate());
  const nx=EXAMS.map(([d,n])=>{const [y,m,dd]=d.split("-").map(Number);return {d:new Date(y,m-1,dd),n};}).find(e=>e.d>=today);
  if(nx){ const k=Math.round((nx.d-today)/86400000); document.getElementById("ddPlan").textContent = k===0 ? `${nx.n} D-DAY` : `${nx.n}까지 D-${k}`; } })();

// PLAN 카드에 오늘 달성률 (자습 배분표에 저장된 내용으로 계산)
(function(){
  try{
    var S=JSON.parse(localStorage.getItem("dgplanner")||"null"); if(!S||!S.weeks) return;
    var pad=function(n){return String(n).padStart(2,"0")};
    var u=new Date(Date.now()+9*3600e3); var t=new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate());
    var mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7));
    var key=mon.getFullYear()+"-"+pad(mon.getMonth()+1)+"-"+pad(mon.getDate());
    var w=S.weeks[key]; var el=document.getElementById("ratePlan"); if(!el) return;
    var plan=0, done=0;
    if(w && w.plan) (w.plan.blocks||[]).forEach(function(b){ if(b.wd===t.getDay()){ var L=b.e-b.s; plan+=L; if(b.done) done+=L; } });
    var hm=function(m){var h=Math.floor(m/60),r=m%60;return (h?h+"시간":"")+(h&&r?" ":"")+(r?r+"분":"")||"0분"};
    if(!plan){ el.textContent="오늘 계획한 자습이 없어요"; el.className="rate none"; return; }
    var r=Math.round(done/plan*100);
    el.innerHTML='오늘 달성률 <strong>'+r+'%</strong><span class="rm">'+hm(done)+' / '+hm(plan)+'</span><span class="rbar"><i style="width:'+Math.min(100,r)+'%"></i></span>';
    el.className="rate "+(r>=70?"hi":r>=40?"mid":"lo");
  }catch(e){}
})();
</script>

  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
  // 아이패드 Safari: 홈 화면에 추가 안내
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  if(isIOS && !standalone){ try{ if(!localStorage.getItem("chagokHintIOS")){ bar.dataset.k="chagokHintIOS";

  // 갤럭시탭 등: 설치 버튼
  var deferred=null;
  window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); deferred=e;
    try{ if(localStorage.getItem("chagokHintInstall")) return; }catch(x){}
    bar.dataset.k="chagokHintInstall";
    show("CHAGOK을 앱으로 설치하면 인터넷 없이도 열려요.","설치하기",function(){ bar.hidden=true; deferred.prompt(); deferred=null; }); });
  if(!("serviceWorker" in navigator)) return;
  var reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){ if(reloading) return; reloading=true; location.reload(); });
  navigator.serviceWorker.register("./sw.js").then(function(reg){
    function offer(w){ bar.dataset.k=""; show("새 버전이 있어요. 기록은 그대로 남아요.","지금 바꾸기",function(){ go.disabled=true; w.postMessage("skipWaiting"); }); }
    if(reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener("updatefound",function(){ var w=reg.installing; if(!w) return;
      w.addEventListener("statechange",function(){ if(w.state==="installed" && navigator.serviceWorker.controller) offer(w); }); });
    document.addEventListener("visibilitychange",function(){ if(!document.hidden) reg.update().catch(function(){}); });
  }).catch(function(){});
})();
